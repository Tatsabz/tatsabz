<!DOCTYPE html>
<html>
<body>
    <h1>تست Supabase</h1>
    <button onclick="testSupabase()">تست کن</button>
    <p id="r"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb = supabase.createClient('https://zthmxszcmoydptofziyk.supabase.co','sb_publishable_mw2BQ5Fmg0v6ATaTSEV63Q_bNCyTCS2');

async function testSupabase(){
    document.getElementById('r').innerText = 'در حال تست...';
    try {
        var { data, error } = await sb.from('personnel').select('*');
        if(error) { document.getElementById('r').innerText = '❌ خطا: ' + error.message; }
        else { document.getElementById('r').innerText = '✅ وصل شد! تعداد پرسنل: ' + data.length; }
    } catch(e) {
        document.getElementById('r').innerText = '❌ خطا: ' + e.message;
    }
}
</script>
</body>
</html>
